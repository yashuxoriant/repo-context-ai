name: Approve Repository Context

# Purpose: transitions a merged context-file pull request from DRAFT to
# APPROVED status, recording the merge commit (spec: context-refresh-pipeline
# "Status transition on approval"). This workflow never decides WHETHER to
# merge - it only reacts to a merge that already happened via the normal PR
# review process.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  mark-approved:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'automated/context-refresh')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository (post-merge)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout repo-context-ai tooling
        uses: actions/checkout@v4
        with:
          repository: yashuxoriant/repo-context-ai
          path: .repo-context-ai-tooling
          ref: main

      - name: Install tooling dependencies
        working-directory: .repo-context-ai-tooling
        run: npm ci

      - name: Mark context file approved
        env:
          TARGET_REPO_PATH: ${{ github.workspace }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node .repo-context-ai-tooling/src/index.js approve

      - name: Commit approved status
        run: |
          git config user.name "repo-context-ai[bot]"
          git config user.email "repo-context-ai[bot]@users.noreply.github.com"
          git add CONTEXT.md .github/copilot-instructions.md
          git diff --cached --quiet || git commit -m "docs: mark repository context approved"
          git push
